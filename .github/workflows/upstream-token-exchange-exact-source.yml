name: Shared Auth upstream token exchange exact-source certification

on:
  pull_request:
    paths:
      - 'certification/upstream-token-exchange/**'
      - '.github/workflows/upstream-token-exchange-exact-source.yml'
  push:
    branches: [main]
    paths:
      - 'certification/upstream-token-exchange/**'
      - '.github/workflows/upstream-token-exchange-exact-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-token-exchange-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_HEAD: 088941eab805143e6824dddc2660628dd69cca14
  PRODUCT_SOURCE_BLOB: 2a14055f15ad73267a496c114c5e6ae37a971b39
  PRODUCT_LIB_BLOB: 104a2842e4116c1e6cc6c1f74bf916f81b7971ca

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact certificate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact product-source lock and mirrored module
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          source=certification/upstream-token-exchange/src/upstream_token_exchange.rs
          test "$(git hash-object "$source")" = "$PRODUCT_SOURCE_BLOB"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('certification/upstream-token-exchange/product-source-lock.json', 'utf8'));
          assert.equal(lock.schema, 'ores.test-org-exact-source-lock/v1');
          assert.equal(lock.repository, 'shared-auth/shared-auth-server.rs');
          assert.equal(lock.pullRequest, 144);
          assert.equal(lock.head, process.env.PRODUCT_HEAD);
          assert.equal(lock.files['src/upstream_token_exchange.rs'], process.env.PRODUCT_SOURCE_BLOB);
          assert.equal(lock.files['src/lib.rs'], process.env.PRODUCT_LIB_BLOB);
          assert.deepEqual(lock.mergeParents, [
            '7d390af742a764c7ed84b3496a2c843753be160b',
            '0f425e50a0c70f276049422691df10d18cccc326',
          ]);
          NODE

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Rustfmt exact-source harness
        run: cargo +1.95.0 fmt --manifest-path certification/upstream-token-exchange/Cargo.toml -- --check

      - name: Strict Clippy exact-source harness
        run: cargo +1.95.0 clippy --manifest-path certification/upstream-token-exchange/Cargo.toml --all-targets -- -D warnings

      - name: Run debug regressions
        run: cargo +1.95.0 test --manifest-path certification/upstream-token-exchange/Cargo.toml

      - name: Run release regressions
        run: cargo +1.95.0 test --release --manifest-path certification/upstream-token-exchange/Cargo.toml

      - name: Assert credential-boundary properties
        shell: bash
        run: |
          set -euo pipefail
          source=certification/upstream-token-exchange/src/upstream_token_exchange.rs
          grep -Fq 'redirect(reqwest::redirect::Policy::none())' "$source"
          grep -Fq 'MAX_TOKEN_RESPONSE_BYTES' "$source"
          grep -Fq 'MAX_BEARER_BYTES' "$source"
          grep -Fq 'OIDC token response is missing id_token' "$source"
          grep -Fq 'UpstreamBearerSecret([REDACTED])' "$source"
          grep -Fq 'transaction.code_verifier.expose_secret()' "$source"
          grep -Fq 'provider-specific OAuth2 subject' "$source"

      - name: Prove exact source was not rewritten
        run: git diff --exit-code -- certification/upstream-token-exchange/src/upstream_token_exchange.rs
