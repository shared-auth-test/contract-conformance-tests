name: ui-smoke

on:
  pull_request:
    paths:
      - "ui-smoke/**"
      - ".github/workflows/ui-smoke.yml"
  push:
    branches: [main]
    paths:
      - "ui-smoke/**"
      - ".github/workflows/ui-smoke.yml"

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui-smoke/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-smoke/ts/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build

  rust-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui-smoke/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui-smoke/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # main, SHA-pinned
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web --project-name shared_auth_ui_smoke_flutter .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --dart-define=SHARED_AUTH_BASE_URL=https://auth.ores-shared-auth.com
