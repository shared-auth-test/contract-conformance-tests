name: dual auth identity alignment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Prove Supabase and Neon subjects map without aliasing
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const principalKey = ({ provider, subject, org }) => {
            if (!['supabase','neon'].includes(provider)) throw new Error('unknown_provider');
            if (!subject || !org) throw new Error('missing_identity_scope');
            return `${org}:${provider}:${subject}`;
          };
          const supa = principalKey({ provider:'supabase', subject:'user-42', org:'acme' });
          const neon = principalKey({ provider:'neon', subject:'user-42', org:'acme' });
          assert.notEqual(supa, neon, 'provider namespace prevents accidental subject aliasing');
          assert.equal(principalKey({ provider:'supabase', subject:'user-42', org:'acme' }), supa);
          assert.notEqual(principalKey({ provider:'supabase', subject:'user-42', org:'other' }), supa, 'tenant scope is part of identity');
          const link = new Map([[supa, 'principal-1'], [neon, 'principal-1']]);
          assert.equal(link.get(supa), link.get(neon), 'explicit link may converge provider identities to one canonical principal');
          assert.throws(() => principalKey({ provider:'other', subject:'user-42', org:'acme' }), /unknown_provider/);
          NODE