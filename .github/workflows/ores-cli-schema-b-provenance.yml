name: ORES CLI Schema B provenance certification

on:
  pull_request:
    paths:
      - 'certification/ores-cli-provenance/**'
      - '.github/workflows/ores-cli-schema-b-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'certification/ores-cli-provenance/**'
      - '.github/workflows/ores-cli-schema-b-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-schema-b-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_HEAD: f8f24185ddb262437b42bf9161539a7f9cae7b9e
  ORES_CLI_PROVENANCE_BLOB: 370e8048e003755978abc90c40c4b51f6cda42ab
  ORES_CLI_DISPATCHER_BLOB: 69e4d6bdab3d2d32dc86588dd3530f919da17857

jobs:
  exact-source-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Check out exact ores-cli product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORES_CLI_HEAD }}
          path: tmp/ores-cli
          persist-credentials: false
          show-progress: false

      - name: Verify exact product bytes and dispatcher order
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git -C tmp/ores-cli rev-parse HEAD)" = "$ORES_CLI_HEAD"
          module=certification/ores-cli-provenance/src/audit/tjsv_generated_schema_provenance.rs
          dispatcher=certification/ores-cli-provenance/snapshots/ores-cli-audit-mod.rs
          product_module=tmp/ores-cli/src/audit/tjsv_generated_schema_provenance.rs
          product_dispatcher=tmp/ores-cli/src/audit/mod.rs
          test "$(git hash-object "$module")" = "$ORES_CLI_PROVENANCE_BLOB"
          test "$(git hash-object "$dispatcher")" = "$ORES_CLI_DISPATCHER_BLOB"
          test "$(git -C tmp/ores-cli hash-object src/audit/tjsv_generated_schema_provenance.rs)" = "$ORES_CLI_PROVENANCE_BLOB"
          test "$(git -C tmp/ores-cli hash-object src/audit/mod.rs)" = "$ORES_CLI_DISPATCHER_BLOB"
          cmp "$module" "$product_module"
          cmp "$dispatcher" "$product_dispatcher"
          evidence_line=$(grep -n 'contract_generated_evidence::augment_contract_generated_evidence_audit' "$dispatcher" | head -1 | cut -d: -f1)
          drift_line=$(grep -n 'tjsv_bidirectional_drift::augment_tjsv_bidirectional_drift_audit' "$dispatcher" | head -1 | cut -d: -f1)
          provenance_line=$(grep -n 'tjsv_generated_schema_provenance::augment_tjsv_generated_schema_provenance_audit' "$dispatcher" | head -1 | cut -d: -f1)
          full_line=$(grep -n 'tjsv_full_check::augment_tjsv_full_check_audit' "$dispatcher" | head -1 | cut -d: -f1)
          revision_line=$(grep -n 'tjsv_workflow_revision::augment_tjsv_workflow_revision_audit' "$dispatcher" | head -1 | cut -d: -f1)
          pins_line=$(grep -n 'workflow_action_pins::augment_workflow_action_pin_audit' "$dispatcher" | head -1 | cut -d: -f1)
          test "$evidence_line" -lt "$drift_line"
          test "$drift_line" -lt "$provenance_line"
          test "$provenance_line" -lt "$full_line"
          test "$full_line" -lt "$revision_line"
          test "$revision_line" -lt "$pins_line"

      - name: Install exact Rust 1.95 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Format exact-source harness
        run: cargo +1.95.0 fmt --manifest-path certification/ores-cli-provenance/Cargo.toml -- --check

      - name: Strict Clippy exact-source harness
        run: cargo +1.95.0 clippy --manifest-path certification/ores-cli-provenance/Cargo.toml --all-targets -- -D warnings

      - name: Run debug unit and black-box regressions
        run: cargo +1.95.0 test --manifest-path certification/ores-cli-provenance/Cargo.toml

      - name: Run release unit and black-box regressions
        run: cargo +1.95.0 test --release --manifest-path certification/ores-cli-provenance/Cargo.toml

      - name: Prove certification and product checkouts remain immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git -C tmp/ores-cli diff --exit-code
