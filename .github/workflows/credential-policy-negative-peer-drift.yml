name: Shared Auth one-sided peer drift controls

on:
  pull_request:
    paths:
      - 'contracts/credential-policy/**'
      - '.github/workflows/credential-policy-negative-peer-drift.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/credential-policy/**'
      - '.github/workflows/credential-policy-negative-peer-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-sided-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Reject JSON-Schema-only constraint drift
        id: json_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@c745036456dd80408b83217118b8563edb8f6abd
        with:
          typespec: contracts/credential-policy/main.tsp
          schema: contracts/credential-policy/negative/authored-ttl-max1800.schema.json
          instances: contracts/credential-policy/instances
          report: .typespec-json-schema-validator/negative-json/report.json
          contract_ir: .typespec-json-schema-validator/negative-json/contract-ir.json
          output_dir: .typespec-json-schema-validator/negative-json/generated
          quiet: 'false'

      - name: Require JSON-Schema-only drift to stop evaluation
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.json_drift.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test -s .typespec-json-schema-validator/negative-json/report.json
          test -s .typespec-json-schema-validator/negative-json/generated/typespec.generated.schema.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/negative-json/report.json', 'utf8'));
          if (report.status !== 'stopped_for_evaluation' || report.zeroUnexplainedFindings !== false) {
            throw new Error(`JSON Schema drift did not fail closed: ${JSON.stringify(report)}`);
          }
          NODE

      - name: Reject TypeSpec-only constraint drift after transpilation
        id: typespec_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@c745036456dd80408b83217118b8563edb8f6abd
        with:
          typespec: contracts/credential-policy/negative/typespec-ttl-max1800.tsp
          schema: contracts/credential-policy/authored.schema.json
          instances: contracts/credential-policy/instances
          report: .typespec-json-schema-validator/negative-typespec/report.json
          contract_ir: .typespec-json-schema-validator/negative-typespec/contract-ir.json
          output_dir: .typespec-json-schema-validator/negative-typespec/generated
          quiet: 'false'

      - name: Require TypeSpec-only drift to stop evaluation
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.typespec_drift.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test -s .typespec-json-schema-validator/negative-typespec/report.json
          test -s .typespec-json-schema-validator/negative-typespec/generated/typespec.generated.schema.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/negative-typespec/report.json', 'utf8'));
          if (report.status !== 'stopped_for_evaluation' || report.zeroUnexplainedFindings !== false) {
            throw new Error(`TypeSpec drift did not fail closed: ${JSON.stringify(report)}`);
          }
          NODE

      - name: Prove authored authorities were not rewritten to manufacture parity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            contracts/credential-policy/main.tsp \
            contracts/credential-policy/authored.schema.json \
            contracts/credential-policy/negative/
