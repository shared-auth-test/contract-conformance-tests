schemaVersion = "ores.rpc.config.v1"
repositoryMode = "client-only"
strict = true

[[env]]
name = "authApiBaseUrl"
env = "SHARED_AUTH_TEST_API_BASE_URL"
valueType = "string"
required = false
secret = false
allowArgv = false

[[env]]
name = "serviceCredential"
env = "SHARED_AUTH_TEST_RPC_CREDENTIAL"
valueType = "string"
required = false
secret = true
allowArgv = false

[[targets]]
name = "client"
role = "client"
roots = ["."]
rpcVersion = "v1"
transports = ["http", "websocket"]
framing = "json"
endpointEnv = "SHARED_AUTH_TEST_API_BASE_URL"
propagateHeaders = ["traceparent", "tracestate", "x-request-id"]
